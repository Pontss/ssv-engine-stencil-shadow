[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ssv-engine"
version = "0.1.0"
description = "Experimental Stencil Shadow Volumes renderer focused on Z-Fail"
requires-python = ">=3.11"
dependencies = [
  "moderngl>=5.10,<6",
  "glfw>=2.7,<3",
  "PyOpenGL>=3.1.7,<4",
  "numpy>=1.26,<3",
  "Pillow>=10.0,<13",
]

[project.scripts]
ssv-engine = "ssv_engine.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ssv_engine = ["shaders/*.vert", "shaders/*.frag"]
